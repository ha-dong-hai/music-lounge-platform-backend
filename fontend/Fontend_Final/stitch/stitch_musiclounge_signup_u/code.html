<style>
        /* Custom styles for floating labels and interactions */
        .input-group {
            position: relative;
        }
        .floating-input {
            width: 100%;
            padding: 1.5rem 1rem 0.5rem 1rem;
            background-color: transparent;
            border: 1px solid theme('colors.outline-variant');
            border-radius: theme('borderRadius.lg');
            color: theme('colors.on-surface');
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .floating-input:focus {
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 1px theme('colors.primary');
        }
        .floating-label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: theme('colors.on-surface-variant');
            pointer-events: none;
            transition: all 0.2s ease;
            font-family: theme('fontFamily.body-md');
            font-size: theme('fontSize.body-md');
        }
        .floating-input:focus ~ .floating-label,
        .floating-input:not(:placeholder-shown) ~ .floating-label {
            top: 0.5rem;
            font-size: 0.75rem;
            transform: translateY(0);
            color: theme('colors.primary');
        }

        /* Parallax effect for polaroids */
        .parallax-container {
            perspective: 1000px;
        }
        .polaroid {
            transition: transform 0.1s ease-out;
            will-change: transform;
            background: white;
            padding: 12px 12px 48px 12px;
            box-shadow: 0 4px 24px rgba(43, 42, 39, 0.08);
            border-radius: 4px; /* Slight rounding for realism */
        }

        /* Hide scrollbar for a cleaner look if content slightly overflows */

<script>
        // Password visibility toggle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Lightweight Parallax Effect for Desktop
        document.addEventListener('DOMContentLoaded', () => {
            const scene = document.getElementById('parallax-scene');
            const polaroids = document.querySelectorAll('.polaroid');

            if (window.innerWidth > 768 && scene) { // Only active on non-mobile
                scene.addEventListener('mousemove', (e) => {
                    const x = e.clientX / window.innerWidth;
                    const y = e.clientY / window.innerHeight;

                    polaroids.forEach(polaroid => {
                        const depth = parseFloat(polaroid.getAttribute('data-depth'));
                        const moveX = (x - 0.5) * depth * 100;
                        const moveY = (y - 0.5) * depth * 100;
                        
                        // Keep original rotation while translating
                        const currentTransform = polaroid.style.transform;
                        // Simple regex to extract current rotation if set via inline style, else fallback to class-based rough estimate (not perfect but works for this subtle effect)
                        
                        polaroid.style.transform = `translate(${moveX}px, ${moveY}px)`;
                    });
                });

                scene.addEventListener('mouseleave', () => {
                    polaroids.forEach(polaroid => {
                         polaroid.style.transform = `translate(0px, 0px)`;
                    });
                });
            }
        });
    </script>
