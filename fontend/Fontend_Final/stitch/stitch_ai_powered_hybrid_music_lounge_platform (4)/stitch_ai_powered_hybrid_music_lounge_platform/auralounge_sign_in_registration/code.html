                        "stack-lg": "80px",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

<body class="bg-background text-on-background font-body-md h-screen w-full flex overflow-hidden antialiased">
<!-- Left Form Panel -->
<div class="w-full md:w-1/2 h-full flex flex-col relative px-margin-mobile md:px-margin-desktop py-stack-lg overflow-y-auto">
<!-- Brand / Logo -->
<div class="absolute top-margin-mobile left-margin-mobile md:top-margin-desktop md:left-margin-desktop">
<a class="font-display-md text-display-md text-primary tracking-tight" href="#">AuraLounge</a>
</div>
<!-- Form Container -->
<div class="flex-grow flex flex-col justify-center max-w-md w-full mx-auto mt-24 md:mt-0">
<div class="mb-stack-md">
<h1 class="font-display-lg text-display-lg text-primary mb-4">Enter the Lounge</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to curate your sonic atmosphere.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Email Input -->
<div class="relative">
<label class="font-label-caps text-label-caps text-on-surface block mb-2 uppercase" for="email">Email Address</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative">
<div class="flex justify-between items-center mb-2">
<label class="font-label-caps text-label-caps text-on-surface block uppercase" for="password">Password</label>
<a class="font-button text-button text-on-surface-variant hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-button text-button py-4 rounded-DEFAULT hover:bg-primary-container transition-colors duration-300 mt-stack-sm flex justify-center items-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-stack-md">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="px-4 font-label-caps text-label-caps text-outline uppercase">Or continue with</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Social Auth -->
<div class="space-y-4">
<button class="w-full border border-outline-variant text-on-surface font-button text-button py-3 rounded-DEFAULT hover:bg-surface-container transition-colors duration-300 flex justify-center items-center gap-3" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="w-full border border-outline-variant text-on-surface font-button text-button py-3 rounded-DEFAULT hover:bg-surface-container transition-colors duration-300 flex justify-center items-center gap-3" type="button">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.26.68 3.08.68.79 0 1.93-.8 3.43-.68 1.48.05 2.76.62 3.55 1.69-3.01 1.76-2.52 5.92.5 7.06-.7 1.76-1.55 3.38-2.56 4.22zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.31 2.38-2.02 4.34-3.74 4.25z"></path>
</svg>
                    Apple
                </button>
</div>
<!-- Registration Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    New to the lounge? 
                    <a class="text-primary font-bold hover:underline decoration-1 underline-offset-4 ml-1" href="#">Join the Circle</a>
</p>
</div>
</div>
<!-- Simplified Footer for Login Context -->
<div class="absolute bottom-margin-mobile left-0 w-full text-center md:bottom-margin-desktop">
<p class="font-label-caps text-label-caps text-outline-variant uppercase tracking-widest">© 2024 AuraLounge</p>
</div>
</div>
<!-- Right Image Panel (Hidden on Mobile) -->
<div class="hidden md:block w-1/2 h-full relative bg-surface-container-high">

<div class="absolute inset-0 bg-cover bg-center" data-alt="A pristine, minimalist architectural interior of a high-end music listening lounge during golden hour. Warm sunlight streams across smooth, cream-colored plaster walls, casting long, elegant shadows. In the foreground, a sleek mid-century modern leather armchair sits beside a sculptural wooden side table holding a single branch in a ceramic vase. The atmosphere is exceptionally calm, exclusive, and acoustic, embodying the quiet luxury of sound. Cinematic lighting, photorealistic, 8k resolution, architectural photography." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBhLsA6FubhXtZ0T30wlDEK3qe1fHEOmePqezVCtbTEV0AsaU3g5IF1OVTcrSWwOCEvO65vSMP4RdPse2ZgKWvRO2xVGs6dY7OcnWuptsBUPmUVLMOqugOjQw8FEh1e7seJhQY42VpGUaLLAKp27DCAW1D2cRnSDAay5LLzRduiF2kgIYeFrdOe9nA98cZk2cwhKvrpCxNiOVNU2ntsjZrN4zQCrxcqn7zL6UdXZDdJ5HSJulNzCGYviQ')"></div>
<!-- Subtle gradient overlay to ensure the image feels integrated and premium -->
<div class="absolute inset-0 bg-gradient-to-l from-transparent to-background/20 mix-blend-multiply"></div>
</div>
</body></html>
