<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim border-b border-outline-variant/10 flex justify-between items-center px-margin-mobile h-16 z-50">
<button aria-label="Go back" class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed tracking-tight truncate px-4">Booking</h1>
<button aria-label="More options" class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 -mr-2">
<span class="material-symbols-outlined">more_horiz</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pt-stack-sm pb-32">
<!-- Event Context -->
<section class="px-margin-mobile mb-stack-md">
<div class="flex items-center gap-2 mb-2 text-on-surface-variant">
<span class="material-symbols-outlined text-sm">schedule</span>
<span class="font-label-caps text-label-caps uppercase">Tonight, 9:00 PM</span>
</div>
<h2 class="font-display-md text-display-md text-primary leading-tight mb-2">Midnight Echoes</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-sm">location_on</span>
                The Velvet Room, NYC
            </p>
</section>
<!-- Floor Plan Selection -->
<section class="flex-1 flex flex-col px-margin-mobile mb-stack-md">
<div class="flex justify-between items-end mb-6">
<div>
<h3 class="font-headline-md text-headline-md text-primary">Select Table</h3>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Stage view included</p>
</div>
<div class="flex gap-4 items-center">
<div class="flex items-center gap-1">
<div class="w-3 h-3 rounded-full bg-surface-variant"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Available</span>
</div>
<div class="flex items-center gap-1">
<div class="w-3 h-3 rounded-full bg-primary"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant">Selected</span>
</div>
</div>
</div>
<!-- Conceptual Floor Plan Area -->
<div class="relative w-full aspect-square bg-surface-container-low rounded-xl border border-outline-variant/20 flex flex-col items-center justify-center p-6 overflow-hidden">
<!-- Stage Representation -->
<div class="absolute top-0 left-0 w-full h-12 bg-gradient-to-b from-surface-container-highest/50 to-transparent flex items-center justify-center border-b border-outline-variant/10">
<span class="font-label-caps text-label-caps tracking-[0.2em] text-on-surface-variant opacity-60">STAGE</span>
</div>
<!-- Abstract Tables -->
<div class="w-full max-w-sm mt-8 grid grid-cols-3 gap-6 place-items-center">
<!-- Row 1 (VIP) -->
<button class="w-16 h-16 rounded-full border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary/20">
<span class="font-label-caps text-label-caps text-on-surface-variant">V1</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary text-on-primary shadow-[0_0_20px_rgba(24,21,18,0.1)] flex items-center justify-center transform scale-110 transition-all duration-300">
<span class="font-label-caps text-label-caps">V2</span>
</button>
<button class="w-16 h-16 rounded-full border border-outline-variant/30 flex items-center justify-center opacity-40 cursor-not-allowed">
<span class="font-label-caps text-label-caps text-on-surface-variant">V3</span>
</button>
<!-- Row 2 -->
<button class="w-14 h-14 rounded-md border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">T1</span>
</button>
<button class="w-14 h-14 rounded-md border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">T2</span>
</button>
<button class="w-14 h-14 rounded-md border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">T3</span>
</button>
<!-- Row 3 -->
<button class="w-12 h-12 rounded-md border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">B1</span>
</button>
<button class="w-12 h-12 rounded-md border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">B2</span>
</button>
<button class="w-12 h-12 rounded-md border border-outline-variant/30 flex items-center justify-center hover:border-primary transition-colors mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant">B3</span>
</button>
</div>
</div>
</section>
</main>
<!-- Bottom Action Bar (Fixed) -->
<div class="fixed bottom-0 w-full z-50 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/10 px-margin-mobile py-4 pb-safe flex items-center justify-between shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-1">Table V2</span>
<span class="font-headline-md text-headline-md text-primary">$450</span>
</div>
<button class="bg-primary text-on-primary font-button text-button px-8 py-4 rounded-lg hover:opacity-90 transition-opacity active:scale-[0.98] min-w-[160px] text-center shadow-sm">
            Confirm Booking
        </button>
</div>
