<style>

          font-variation-settings:
          'FILL' 0,
          'wght' 300,

            -webkit-box-shadow: 0 0 0 30px #fbf9f4 inset !important;

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans">
<!-- Navbar Suppressed as per instructions for Transactional/Login flows -->
<main class="flex-grow flex flex-col px-margin-mobile pt-stack-md pb-stack-lg relative overflow-hidden">
<!-- Subtle decorative background element for depth -->
<div class="absolute -top-[20%] -right-[20%] w-[80vw] h-[80vw] rounded-full bg-surface-container blur-[100px] opacity-40 -z-10 pointer-events-none"></div>
<!-- Back Button -->
<div class="mb-stack-sm mt-4">
<button aria-label="Go back" class="inline-flex items-center justify-center p-unit text-on-surface-variant hover:text-primary transition-colors duration-200">
<span aria-hidden="true" class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
</div>
<div class="flex-grow flex flex-col max-w-[400px] w-full mx-auto justify-center pb-[132px]">
<header class="mb-stack-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-unit">Forgot Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter the email address associated with your account, and we'll send you a link to reset your password.
                </p>
</header>
<form action="#" class="flex flex-col space-y-stack-md" method="POST" novalidate="">
<!-- Input Group (Underlined Style for Audience View) -->
<div class="relative group">
<input class="w-full bg-transparent border-0 border-b border-outline-variant/30 py-3 px-0 font-body-md text-body-md text-primary placeholder:text-transparent focus:ring-0 focus:border-primary transition-colors duration-300 peer" id="email" name="email" placeholder="Email Address" required="" type="email"/>
<label class="absolute left-0 top-3 font-body-md text-body-md text-on-surface-variant transition-all duration-300 transform origin-left peer-focus:-translate-y-6 peer-focus:scale-75 peer-focus:text-primary peer-[:not(:placeholder-shown)]:-translate-y-6 peer-[:not(:placeholder-shown)]:scale-75 pointer-events-none" for="email">
                        Email Address
                    </label>
</div>
<!-- Primary Button -->
<button class="w-full bg-primary text-on-primary py-4 px-6 rounded flex items-center justify-between group hover:bg-on-surface transition-colors duration-300" type="submit">
<span class="font-button text-button">Send reset link</span>
<span aria-hidden="true" class="material-symbols-outlined transform group-hover:translate-x-1 transition-transform duration-300">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="mt-stack-sm text-center">
<a class="inline-flex items-center font-button text-button text-outline hover:text-primary transition-colors duration-200" href="#">
                    Return to Sign In
                </a>
</div>
</div>
</main>
