<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<div class="w-full max-w-md flex flex-col gap-stack-md relative z-10">
<header class="flex flex-col gap-unit text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Verify Your Resonance</h1>
<p class="font-body-md text-body-md text-on-surface-variant">We've sent a unique frequency to <br/><span class="font-bold text-primary">j***@gmail.com</span></p>
</header>
<main class="flex flex-col gap-stack-sm w-full">
<form class="flex flex-col gap-stack-md w-full" id="otpForm">
<div class="flex justify-between gap-unit w-full" id="otp-inputs">
<input aria-label="Digit 1" class="w-12 h-14 bg-transparent border-b border-outline focus:border-primary text-center font-display-md text-display-md text-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" placeholder="·" type="number"/>
<input aria-label="Digit 2" class="w-12 h-14 bg-transparent border-b border-outline focus:border-primary text-center font-display-md text-display-md text-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" placeholder="·" type="number"/>
<input aria-label="Digit 3" class="w-12 h-14 bg-transparent border-b border-outline focus:border-primary text-center font-display-md text-display-md text-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" placeholder="·" type="number"/>
<input aria-label="Digit 4" class="w-12 h-14 bg-transparent border-b border-outline focus:border-primary text-center font-display-md text-display-md text-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" placeholder="·" type="number"/>
<input aria-label="Digit 5" class="w-12 h-14 bg-transparent border-b border-outline focus:border-primary text-center font-display-md text-display-md text-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" placeholder="·" type="number"/>
<input aria-label="Digit 6" class="w-12 h-14 bg-transparent border-b border-outline focus:border-primary text-center font-display-md text-display-md text-primary focus:outline-none transition-colors" maxlength="1" pattern="\d*" placeholder="·" type="number"/>
</div>
<button class="w-full bg-primary text-on-primary font-button text-button py-4 px-6 rounded hover:bg-on-surface-variant transition-colors flex items-center justify-center gap-2" type="submit">
                    Verify
                    <span class="material-symbols-outlined text-[18px]">arrow_right_alt</span>
</button>
</form>
<div class="flex flex-col items-center gap-unit text-center mt-stack-sm">
<p class="font-body-md text-body-md text-outline">
                    Didn't receive the code? 
                    <button class="text-primary hover:text-on-surface-variant transition-colors disabled:opacity-50 disabled:cursor-not-allowed ml-1" disabled="" id="resendBtn">
                        Resend code <span class="font-label-caps text-label-caps ml-1" id="timer">(0:45)</span>
</button>
</p>
<a class="font-label-caps text-label-caps text-outline hover:text-primary transition-colors flex items-center gap-1 mt-stack-sm" href="#">
<span class="material-symbols-outlined text-[16px]">west</span>
                    RETURN TO LOGIN
                </a>
</div>
</main>
</div>
<script>
        const inputs = document.querySelectorAll('#otp-inputs input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple timer logic
        let timeLeft = 45;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resendBtn');

        const countdown = setInterval(() => {
            timeLeft--;
            const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
            timerElement.textContent = `(0:${seconds})`;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = '';
                resendBtn.disabled = false;
            }
        }, 1000);
    </script>
