<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col items-center justify-center font-body-md">
<div class="ambient-glow"></div>
<div class="w-full max-w-md px-margin-mobile flex flex-col h-screen md:h-auto md:py-margin-desktop justify-between md:justify-center z-10 relative bg-surface md:rounded-xl md:shadow-[0_40px_100px_rgba(24,21,18,0.05)] md:border md:border-outline-variant/20 md:p-12">
<div class="pt-8 md:pt-0">
<!-- Back Action -->
<button class="mb-12 flex items-center text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined mr-2 text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span class="font-button text-button">Back to login</span>
</button>
<!-- Header -->
<div class="mb-12">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-4">Reset Password</h1>
<p class="text-on-surface-variant font-body-md text-body-md opacity-80 max-w-[280px]">
                    Create a new, secure password for your Aura account.
                </p>
</div>
<!-- Form -->
<form class="space-y-stack-md w-full">
<!-- New Password Field -->
<div class="relative w-full">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="new-password">NEW PASSWORD</label>
<div class="relative flex items-center w-full">
<input class="input-underline w-full font-body-md text-body-md text-primary placeholder-on-surface-variant/40 pr-10" id="new-password" placeholder="Enter new password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 text-on-surface-variant/60 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-4 flex gap-1 h-1 w-full opacity-60">
<div class="h-full bg-primary/20 flex-1 rounded-full"></div>
<div class="h-full bg-primary/20 flex-1 rounded-full"></div>
<div class="h-full bg-primary/20 flex-1 rounded-full"></div>
<div class="h-full bg-primary/20 flex-1 rounded-full"></div>
</div>
<p class="font-label-caps text-[10px] tracking-wider text-on-surface-variant/60 mt-2 text-right uppercase">Weak</p>
</div>
<!-- Confirm Password Field -->
<div class="relative w-full">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="confirm-password">CONFIRM PASSWORD</label>
<div class="relative flex items-center w-full">
<input class="input-underline w-full font-body-md text-body-md text-primary placeholder-on-surface-variant/40 pr-10" id="confirm-password" placeholder="Re-enter new password" type="password"/>
<!-- Validation Indicator (Success state example) -->
<span class="absolute right-0 text-outline-variant transition-colors opacity-0 pointer-events-none" id="match-icon">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
</span>
</div>
</div>
</form>
</div>
<!-- Bottom Action Area -->
<div class="pb-12 md:pb-0 pt-stack-lg w-full">
<button class="w-full bg-primary text-on-primary font-button text-button py-4 px-6 rounded-DEFAULT hover:opacity-90 transition-opacity flex justify-center items-center active:scale-[0.98]" type="submit">
                Reset Password
            </button>
</div>
</div>
<script>
        // Simple interactions for demonstration
        document.addEventListener('DOMContentLoaded', () => {
            const newPassword = document.getElementById('new-password');
            const confirmPassword = document.getElementById('confirm-password');
            const matchIcon = document.getElementById('match-icon');
            
            // Toggle visibility logic (mock)
            const toggleBtns = document.querySelectorAll('button[aria-label="Toggle password visibility"]');
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const input = e.currentTarget.previousElementSibling;
                    const icon = e.currentTarget.querySelector('span');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.textContent = 'visibility';
                    } else {
                        input.type = 'password';
                        icon.textContent = 'visibility_off';
                    }
                });
            });

            // Mock match validation
            confirmPassword.addEventListener('input', () => {
                if(confirmPassword.value.length > 0 && confirmPassword.value === newPassword.value) {
                    matchIcon.classList.remove('opacity-0', 'text-outline-variant');
                    matchIcon.classList.add('opacity-100', 'text-secondary'); // Using secondary color for subtle success state per Aura brand
                } else {
                    matchIcon.classList.add('opacity-0', 'text-outline-variant');
                    matchIcon.classList.remove('opacity-100', 'text-secondary');
                }
            });
        });
    </script>
