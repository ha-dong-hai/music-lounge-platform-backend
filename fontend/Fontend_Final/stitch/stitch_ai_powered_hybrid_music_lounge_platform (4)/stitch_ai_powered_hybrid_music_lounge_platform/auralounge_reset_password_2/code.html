<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim z-50">
<div class="flex justify-between items-center px-margin-mobile py-4 w-full">
<button aria-label="Back" class="text-primary dark:text-primary-fixed cursor-pointer transition-transform duration-200 active:scale-95 hover:opacity-80 transition-opacity flex items-center justify-center p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed font-bold tracking-tight">AuraLounge</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile pt-stack-md pb-stack-lg w-full max-w-md mx-auto">
<!-- Header Section -->
<div class="mb-stack-md">
<h2 class="font-headline-md text-headline-md text-primary mb-unit">Forgot Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Enter the email associated with your account and we will send you a link to reset your password.
            </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-stack-sm flex-grow">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-0 py-3 font-body-md text-body-md text-on-surface placeholder-on-surface-variant/50 transition-colors rounded-none" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<!-- Action Button -->
<div class="mt-auto pt-stack-md">
<button class="w-full bg-primary text-on-primary font-button text-button py-4 px-6 rounded-DEFAULT flex items-center justify-center gap-2 hover:opacity-90 transition-opacity" type="submit">
                    Send reset link
                    <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="text-center mt-6">
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors underline decoration-1 underline-offset-4" href="#">Return to Sign In</a>
</div>
</form>
