<body class="min-h-screen flex flex-col items-center justify-center px-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-[400px] flex flex-col items-center gap-stack-md text-center">
<!-- Icon -->
<div aria-hidden="true" class="w-20 h-20 rounded-full bg-surface-container flex items-center justify-center mb-stack-sm">
<span class="material-symbols-outlined text-display-md text-primary" style="font-variation-settings: 'FILL' 0;">
                mark_email_read
            </span>
</div>
<!-- Headings -->
<div class="flex flex-col gap-unit">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Verify your email</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-unit">
                We've sent a 6-digit code to <br/>
<span class="text-primary font-medium">connoisseur@auralounge.com</span>
</p>
</div>
<!-- OTP Input Group -->
<form class="w-full flex flex-col gap-stack-md mt-stack-sm" id="otp-form" onsubmit="event.preventDefault();">
<div class="flex justify-between w-full gap-2">
<input class="otp-input w-12 h-14 bg-transparent border-0 border-b border-outline-variant text-center font-display-md text-[32px] text-primary rounded-none transition-colors duration-200" maxlength="1" pattern="\d*" required="" type="number"/>
<input class="otp-input w-12 h-14 bg-transparent border-0 border-b border-outline-variant text-center font-display-md text-[32px] text-primary rounded-none transition-colors duration-200" maxlength="1" pattern="\d*" required="" type="number"/>
<input class="otp-input w-12 h-14 bg-transparent border-0 border-b border-outline-variant text-center font-display-md text-[32px] text-primary rounded-none transition-colors duration-200" maxlength="1" pattern="\d*" required="" type="number"/>
<input class="otp-input w-12 h-14 bg-transparent border-0 border-b border-outline-variant text-center font-display-md text-[32px] text-primary rounded-none transition-colors duration-200" maxlength="1" pattern="\d*" required="" type="number"/>
<input class="otp-input w-12 h-14 bg-transparent border-0 border-b border-outline-variant text-center font-display-md text-[32px] text-primary rounded-none transition-colors duration-200" maxlength="1" pattern="\d*" required="" type="number"/>
<input class="otp-input w-12 h-14 bg-transparent border-0 border-b border-outline-variant text-center font-display-md text-[32px] text-primary rounded-none transition-colors duration-200" maxlength="1" pattern="\d*" required="" type="number"/>
</div>
<!-- Actions -->
<div class="flex flex-col gap-stack-sm w-full mt-4">
<button class="w-full bg-primary text-on-primary py-4 rounded-DEFAULT font-button text-button hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                    Verify
                </button>
<button class="w-full py-4 text-outline hover:text-primary font-button text-button transition-colors duration-200" type="button">
                    Resend code
                </button>
</div>
</form>
</main>
<script>
        // Simple OTP input logic for auto-focusing next/prev
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Keep only first digit if multiple entered
                if(e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                
                // Move to next input if filled
                if (e.target.value !== '' && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Move to previous input on backspace if empty
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Allow pasting full code
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/\D/g, '');
                
                if(pastedData.length > 0) {
                    pastedData.split('').forEach((char, i) => {
                        if(i < inputs.length) {
                            inputs[i].value = char;
                            if(i < inputs.length - 1) {
                                inputs[i+1].focus();
                            } else {
                                inputs[i].focus();
                                inputs[i].blur(); // blur last input
                            }
                        }
                    });
                }
            });
        });

        // Focus first input on load
        window.onload = () => {
            if(inputs.length > 0) inputs[0].focus();
        }
    </script>
