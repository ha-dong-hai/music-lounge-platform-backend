<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Staff POS - AuraLounge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&amp;family=Libre+Caslon+Text:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "on-primary-container": "#96908b",
                        "tertiary-fixed": "#ffdad3",
                        "on-primary": "#ffffff",
                        "secondary-container": "#fed488",
                        "on-tertiary-container": "#cb7c6b",
                        "on-surface-variant": "#4d4540",
                        "tertiary-container": "#4d190e",
                        "surface-variant": "#e4e2dd",
                        "on-background": "#1b1c19",
                        "on-secondary-fixed-variant": "#5d4201",
                        "secondary-fixed-dim": "#e9c176",
                        "surface-container-high": "#eae8e3",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#1e1b18",
                        "on-tertiary-fixed": "#3a0a03",
                        "secondary-fixed": "#ffdea5",
                        "secondary": "#775a19",
                        "surface-tint": "#635d5a",
                        "background": "#fbf9f4",
                        "tertiary-fixed-dim": "#ffb4a4",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#30312e",
                        "surface-container-low": "#f5f3ee",
                        "on-surface": "#1b1c19",
                        "primary": "#181512",
                        "inverse-primary": "#cdc5c0",
                        "outline-variant": "#cfc4bd",
                        "inverse-on-surface": "#f2f1ec",
                        "on-secondary-fixed": "#261900",
                        "surface-container-highest": "#e4e2dd",
                        "surface": "#fbf9f4",
                        "on-tertiary-fixed-variant": "#723527",
                        "primary-fixed-dim": "#cdc5c0",
                        "on-error": "#ffffff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#4b4642",
                        "primary-fixed": "#e9e1dc",
                        "on-secondary-container": "#785a1a",
                        "outline": "#7e756f",
                        "primary-container": "#2d2926",
                        "surface-container": "#f0eee9",
                        "tertiary": "#310501",
                        "surface-bright": "#fbf9f4",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dbdad5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "16px",
                        "gutter": "32px",
                        "container-max": "1440px",
                        "stack-md": "32px",
                        "stack-lg": "80px",
                        "margin-desktop": "64px",
                        "unit": "8px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "body-lg": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "headline-lg": ["Libre Caslon Text"],
                        "display-md": ["Libre Caslon Text"],
                        "headline-md": ["Libre Caslon Text"],
                        "button": ["Manrope"],
                        "display-lg": ["Libre Caslon Text"],
                        "body-md": ["Manrope"],
                        "headline-lg-mobile": ["Libre Caslon Text"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "display-md": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.01em", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "400" }],
                        "button": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .tap-highlight-transparent { -webkit-tap-highlight-color: transparent; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md antialiased md:hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md flex items-center justify-between px-margin-mobile h-16">
<button class="text-primary dark:text-on-background hover:opacity-70 transition-opacity scale-95 active:transition-transform">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display-md text-headline-md text-primary tracking-tighter">The Velvet Room - Active</h1>
<button class="text-primary dark:text-on-background hover:opacity-70 transition-opacity scale-95 active:transition-transform">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-margin-mobile flex flex-col gap-stack-md">
<!-- Primary Action -->
<section class="flex flex-col gap-unit">
<button class="w-full bg-primary text-on-primary rounded-xl py-6 flex flex-col items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-sm">
<span class="material-symbols-outlined text-[48px]" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="font-button text-button">Scan Ticket</span>
</button>
</section>
<!-- Table Management -->
<section class="flex flex-col gap-stack-sm">
<div class="flex items-center justify-between">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Table Management</h2>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">8 Active</span>
</div>
<div class="flex flex-col gap-unit">
<!-- Table Card - Action Needed -->
<div class="bg-error-container text-on-error-container rounded-lg p-4 flex items-center justify-between active:scale-[0.98] transition-transform shadow-sm">
<div class="flex items-center gap-4">
<div class="bg-error/10 rounded-full p-2 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="table_restaurant" style="font-variation-settings: 'FILL' 1;">table_restaurant</span>
</div>
<div>
<h3 class="font-button text-button">Table 4</h3>
<p class="font-label-caps text-label-caps opacity-80 uppercase mt-1">Action Needed</p>
</div>
</div>
<button class="bg-on-error-container text-error-container font-button text-button px-4 py-2 rounded">
                        View
                    </button>
</div>
<!-- Table Card - Normal -->
<div class="bg-surface-container rounded-lg p-4 flex items-center justify-between border border-outline-variant/20 active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="bg-surface-variant rounded-full p-2 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="table_restaurant" style="font-variation-settings: 'FILL' 1;">table_restaurant</span>
</div>
<div>
<h3 class="font-button text-button text-primary">Table 7</h3>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-1">2 Guests</p>
</div>
</div>
<button class="bg-surface-variant text-primary font-button text-button px-4 py-2 rounded border border-outline-variant/30">
                        View
                    </button>
</div>
<!-- Table Card - Normal -->
<div class="bg-surface-container rounded-lg p-4 flex items-center justify-between border border-outline-variant/20 active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="bg-surface-variant rounded-full p-2 flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="table_restaurant" style="font-variation-settings: 'FILL' 1;">table_restaurant</span>
</div>
<div>
<h3 class="font-button text-button text-primary">Table 12</h3>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase mt-1">6 Guests</p>
</div>
</div>
<button class="bg-surface-variant text-primary font-button text-button px-4 py-2 rounded border border-outline-variant/30">
                        View
                    </button>
</div>
</div>
</section>
</main>
<!-- Staff BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-2 px-4 z-50 pb-safe bg-surface/90 border-t border-outline-variant/10 backdrop-blur-xl">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors tap-highlight-transparent active:scale-90 duration-200 w-20" href="#">
<span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
<span class="font-label-caps text-label-caps mt-1">Dashboard</span>
</a>
<a class="flex flex-col items-center justify-center text-primary bg-secondary-container/30 rounded-full px-4 py-1 hover:text-primary transition-colors tap-highlight-transparent active:scale-90 duration-200 w-20" href="#">
<span class="material-symbols-outlined" data-icon="table_restaurant" style="font-variation-settings: 'FILL' 1;">table_restaurant</span>
<span class="font-label-caps text-label-caps mt-1">Tables</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors tap-highlight-transparent active:scale-90 duration-200 w-20" href="#">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
<span class="font-label-caps text-label-caps mt-1">Orders</span>
</a>
</nav>
</body></html>
