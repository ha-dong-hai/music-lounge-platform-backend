<style>
        .glass-panel {
            background: rgba(251, 249, 244, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(126, 117, 111, 0.15);
        }
        
        .input-underline {
            border: none;
            border-bottom: 1px solid rgba(126, 117, 111, 0.3);
            background: transparent;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }
        
        .input-underline:focus {
            box-shadow: none;
            border-bottom-color: #181512;
        }

        .category-chip input[type="radio"]:checked + div {
            background-color: #181512;
            color: #ffffff;
            border-color: #181512;
        }
        
        /* Hide scrollbar for category chips but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface h-full flex flex-col font-body-md antialiased md:hidden"> <!-- Mobile only as per prompt -->
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface/80 dark:bg-surface/80 border-b border-outline-variant/10">
<div class="flex justify-between items-center h-20 px-margin-mobile w-full">
<button aria-label="Back" class="text-primary dark:text-primary-fixed-dim hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-md text-display-md uppercase tracking-widest text-primary dark:text-primary-fixed-dim tracking-[0.2em]">AURA</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto pt-24 pb-32 px-margin-mobile">
<div class="max-w-md mx-auto space-y-stack-md">
<!-- Page Header -->
<div class="space-y-unit">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Report an Issue</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Your feedback helps us curate a better atmosphere. Please provide details below.</p>
</div>
<form class="space-y-stack-md">
<!-- Category Selection (Horizontal Scroll Chips) -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Category</label>
<div class="flex overflow-x-auto no-scrollbar gap-unit pb-2 -mx-margin-mobile px-margin-mobile">
<label class="category-chip shrink-0 cursor-pointer">
<input checked="" class="sr-only" name="category" type="radio" value="ticket"/>
<div class="px-4 py-2 border border-outline-variant/50 rounded text-sm transition-colors duration-200 bg-surface">
                                Ticket Issue
                            </div>
</label>
<label class="category-chip shrink-0 cursor-pointer">
<input class="sr-only" name="category" type="radio" value="donation"/>
<div class="px-4 py-2 border border-outline-variant/50 rounded text-sm transition-colors duration-200 bg-surface">
                                Donation
                            </div>
</label>
<label class="category-chip shrink-0 cursor-pointer">
<input class="sr-only" name="category" type="radio" value="conduct"/>
<div class="px-4 py-2 border border-outline-variant/50 rounded text-sm transition-colors duration-200 bg-surface">
                                Venue Conduct
                            </div>
</label>
<label class="category-chip shrink-0 cursor-pointer">
<input class="sr-only" name="category" type="radio" value="other"/>
<div class="px-4 py-2 border border-outline-variant/50 rounded text-sm transition-colors duration-200 bg-surface">
                                Other
                            </div>
</label>
</div>
</div>
<!-- Target Search (Show/Venue) -->
<div class="space-y-unit relative">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="target">Related Show or Venue</label>
<div class="relative">
<input class="w-full input-underline py-2 font-body-md text-body-md text-primary placeholder:text-outline-variant focus:ring-0" id="target" placeholder="Search for event or location..." type="text"/>
<span class="material-symbols-outlined absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="search">search</span>
</div>
</div>
<!-- Phone Number (Required for Guests) -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="phone">Contact Number <span class="text-error">*</span></label>
<input class="w-full input-underline py-2 font-body-md text-body-md text-primary placeholder:text-outline-variant focus:ring-0" id="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
<!-- Description Area -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="description">Description</label>
<textarea class="w-full input-underline py-2 font-body-md text-body-md text-primary placeholder:text-outline-variant focus:ring-0 resize-none" id="description" placeholder="Please provide specific details..." rows="4"></textarea>
</div>
<!-- Photo Evidence Upload (Glassmorphism Bento Style) -->
<div class="space-y-unit">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase">Photo Evidence (Optional)</label>
<div class="glass-panel rounded-lg p-6 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-surface-container-low transition-colors duration-200 border-dashed border-2 border-outline-variant/30 relative overflow-hidden group">
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" multiple="" type="file"/>
<span class="material-symbols-outlined text-3xl text-outline mb-2 group-hover:text-primary transition-colors" data-icon="add_a_photo" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
<p class="font-body-md text-sm text-on-surface-variant group-hover:text-primary transition-colors">Tap to upload photos</p>
<p class="font-body-md text-xs text-outline-variant mt-1">JPEG, PNG up to 5MB</p>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-sm">
<button class="w-full bg-primary text-on-primary font-button text-button py-4 px-6 rounded hover:opacity-90 transition-opacity flex items-center justify-center space-x-2" type="button">
<span>Submit Report</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<!-- BottomNavBar (Suppressed as this is a task-focused, transactional screen with a back button) -->
<!-- Navigation shell is deliberately excluded here following the Semantic Shell Mandate for focused journeys. -->
<script>
        // Simple micro-interaction for the file upload area
        const fileInput = document.querySelector('input[type="file"]');
        const uploadArea = document.querySelector('.glass-panel');
        const uploadText = uploadArea.querySelector('p.text-sm');
        const uploadIcon = uploadArea.querySelector('.material-symbols-outlined');

        if(fileInput && uploadArea) {
            fileInput.addEventListener('change', (e) => {
                if(e.target.files.length > 0) {
                    const count = e.target.files.length;
                    uploadText.textContent = `${count} file${count > 1 ? 's' : ''} selected`;
                    uploadText.classList.add('text-primary', 'font-medium');
                    uploadIcon.textContent = 'check_circle';
                    uploadIcon.classList.add('text-primary');
                    uploadArea.classList.add('border-primary/50', 'bg-surface-container-low');
                } else {
                    uploadText.textContent = 'Tap to upload photos';
                    uploadText.classList.remove('text-primary', 'font-medium');
                    uploadIcon.textContent = 'add_a_photo';
                    uploadIcon.classList.remove('text-primary');
                    uploadArea.classList.remove('border-primary/50', 'bg-surface-container-low');
                }
            });
        }
    </script>
</body></html>
