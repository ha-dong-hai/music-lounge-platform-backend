<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AuraLounge - Reserve Table</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

                        "secondary-fixed": "#ffdea5",

                        "inverse-surface": "#30312e",

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col">
<!-- TopNavBar (Nav suppressed due to transactional nature of booking, but header retained for context) -->
<header class="docked full-width top-0 z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant/10">
<div class="flex justify-between items-center h-20 px-margin-mobile md:px-margin-desktop max-w-container-max mx-auto">
<a class="text-headline-md font-headline-md text-primary tracking-tight" href="#">AuraLounge</a>
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col lg:flex-row max-w-container-max mx-auto w-full">
<!-- Interactive Floor Plan (Left/Top) -->
<section class="flex-1 p-margin-mobile md:p-margin-desktop bg-surface-container-lowest border-r border-outline-variant/10 relative overflow-hidden flex items-center justify-center min-h-[614px] lg:min-h-0"><div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: url('https://www.transparenttextures.com/patterns/linen.png');"></div>
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(circle at center, #181512 1px, transparent 1px); background-size: 24px 24px;"></div>
<div class="w-full max-w-2xl flex flex-col items-center relative z-10">
<!-- Stage -->
<div class="w-3/4 h-20 bg-surface-container-high rounded-t-full mb-16 flex items-center justify-center border-t-2 border-x border-outline-variant/30 shadow-sm relative overflow-hidden"><div class="absolute inset-0 bg-gradient-to-b from-white/20 to-transparent"></div><span class="text-label-caps font-label-caps text-on-surface-variant tracking-[0.3em] uppercase relative z-10">The Stage</span></div>
<!-- Tables Grid -->
<div class="grid grid-cols-3 gap-x-12 gap-y-16 w-full"><!-- VIP Row -->
<button aria-label="Table V1, Occupied" class="group flex flex-col items-center gap-3 relative opacity-60">
<div class="w-16 h-16 rounded-lg bg-surface-dim border border-outline-variant/20 flex items-center justify-center cursor-not-allowed">
<span class="material-symbols-outlined text-outline/40">event_busy</span>
</div>
<span class="text-label-caps font-label-caps text-outline">V1 (Occupied)</span>
</button>
<button aria-label="Table V2, Selected" class="group flex flex-col items-center gap-3 relative">
<div class="w-16 h-16 rounded-lg bg-primary flex items-center justify-center shadow-lg scale-110 transition-transform border-2 border-secondary">
<span class="material-symbols-outlined text-on-primary">chair_alt</span>
</div>
<span class="text-label-caps font-label-caps text-primary font-bold">V2</span>
</button>
<button aria-label="Table V3, Available" class="group flex flex-col items-center gap-3 relative">
<div class="w-16 h-16 rounded-lg bg-surface hover:bg-surface-container border border-outline-variant hover:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-outline group-hover:text-primary">chair_alt</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">V3</span>
</button>
<!-- Tier 1 Row -->
<button aria-label="Table T1, Available" class="group flex flex-col items-center gap-3 relative">
<div class="w-14 h-14 rounded-full bg-surface hover:bg-surface-container border border-outline-variant hover:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-outline group-hover:text-primary text-sm">table_restaurant</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">T1</span>
</button>
<button aria-label="Table T2, Available" class="group flex flex-col items-center gap-3 relative">
<div class="w-14 h-14 rounded-full bg-surface hover:bg-surface-container border border-outline-variant hover:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-outline group-hover:text-primary text-sm">table_restaurant</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">T2</span>
</button>
<button aria-label="Table T3, Available" class="group flex flex-col items-center gap-3 relative">
<div class="w-14 h-14 rounded-full bg-surface hover:bg-surface-container border border-outline-variant hover:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-outline group-hover:text-primary text-sm">table_restaurant</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">T3</span>
</button>
<!-- Bar Row -->
<button aria-label="Table B1, Available" class="group flex flex-col items-center gap-3 relative">
<div class="w-12 h-12 rounded-full bg-surface hover:bg-surface-container border border-outline-variant hover:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-outline group-hover:text-primary text-xs">local_bar</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">B1</span>
</button>
<button aria-label="Table B2, Occupied" class="group flex flex-col items-center gap-3 relative opacity-60">
<div class="w-12 h-12 rounded-full bg-surface-dim border border-outline-variant/20 flex items-center justify-center cursor-not-allowed">
<span class="material-symbols-outlined text-outline/40 text-xs">block</span>
</div>
<span class="text-label-caps font-label-caps text-outline">B2</span>
</button>
<button aria-label="Table B3, Available" class="group flex flex-col items-center gap-3 relative">
<div class="w-12 h-12 rounded-full bg-surface hover:bg-surface-container border border-outline-variant hover:border-primary transition-all flex items-center justify-center">
<span class="material-symbols-outlined text-outline group-hover:text-primary text-xs">local_bar</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">B3</span>
</button></div>
</div>
<div class="absolute bottom-margin-desktop left-margin-desktop flex gap-6">
<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full border border-outline-variant bg-surface"></div><span class="text-label-caps font-label-caps text-on-surface-variant">Available</span></div>
<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-primary"></div><span class="text-label-caps font-label-caps text-on-surface-variant">Selected</span></div>
<div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-surface-dim border border-outline-variant/30"></div><span class="text-label-caps font-label-caps text-on-surface-variant">Occupied</span></div>
</div>
</section>
<!-- Sidebar / Booking Details (Right) -->
<aside class="w-full lg:w-[480px] p-margin-mobile md:p-margin-desktop flex flex-col bg-surface z-10">
<div class="flex-grow flex flex-col gap-stack-md">
<div>
<span class="text-label-caps font-label-caps text-on-tertiary-container tracking-[0.2em] uppercase mb-4 block">The Velvet Room</span>
<h1 class="text-display-md font-display-md text-primary mb-2">Midnight Echoes</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Tonight, 9:00 PM</p>
</div>
<div class="w-full h-px bg-outline-variant/20 my-4"></div>
<div class="flex flex-col gap-4">
<h3 class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-[0.1em]">Selection</h3>
<div class="p-6 border-x border-y border-outline-variant/20 rounded-lg bg-surface-container-low/50 flex justify-between items-center shadow-sm">
<div>
<p class="text-label-caps font-label-caps text-secondary uppercase tracking-widest mb-1">Selected Table</p>
<p class="text-headline-md font-headline-md text-primary">Table V2</p>
<p class="text-body-md font-body-md text-on-surface-variant/80">VIP Section · Up to 4 Guests</p>
</div>
<div class="text-right">
<p class="text-headline-md font-headline-md text-primary">$450</p>
<p class="text-xs text-on-surface-variant uppercase tracking-tighter">Per Night</p>
</div>
</div>
</div>
<div class="mt-auto flex flex-col gap-4">
<div class="flex justify-between items-center py-4 border-t border-outline-variant/20">
<span class="text-body-lg font-body-lg text-on-surface-variant">Total</span>
<span class="text-headline-md font-headline-md text-primary font-bold">$450.00</span>
</div>
<button class="w-full py-5 px-8 bg-primary text-on-primary text-button font-button rounded-full hover:bg-primary-container transition-all uppercase tracking-[0.15em] flex justify-center items-center gap-3 border border-white/10 shadow-lg hover:shadow-xl active:scale-[0.98]">
                        Confirm Booking
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<p class="text-center text-xs text-on-surface-variant mt-2">By confirming, you agree to our Terms of Service.</p>
</div>
</div>
</aside>
</main>
</body></html>
