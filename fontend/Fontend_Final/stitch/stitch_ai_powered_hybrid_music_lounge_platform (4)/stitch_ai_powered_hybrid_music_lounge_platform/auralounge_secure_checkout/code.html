<body class="flex flex-col min-h-screen pt-safe pb-safe bg-background text-on-background relative md:hidden">
<!-- Top Navigation (Transactional, no Bottom Nav) -->
<header class="flex items-center justify-between px-margin-mobile h-16 bg-background/90 backdrop-blur-md sticky top-0 z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-background" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter">Checkout</h1>
<div class="w-10 h-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pb-32">
<!-- Order Summary Card -->
<section class="mt-stack-sm mb-stack-md relative rounded-xl overflow-hidden bg-surface border border-outline-variant/20">
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-surface/90 pointer-events-none z-10"></div>
<div class="h-48 w-full relative">
<img class="w-full h-full object-cover" data-alt="A high-end, softly lit jazz club interior with rich cream and charcoal tones, focusing on a premium reserved table near the stage. The lighting is moody but sophisticated, highlighting the luxurious textures of the seating in a minimalist setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBw_M_EUhOsaMdvOtIZJFp0KPOTvOkSWOehZKtnquwgYRiRbh_wx_EFW-BQ3MSNcaEllkqxsMwaLDG3gpGGKRwr2XqZ2HomZF6oIIHHpNqlQUAKYUB0_2xduaoN1U9i6pqKa9mf1Doma1E8_5YR31BtD_snTSMvkFWFaDaFeyhdg4kxpj4LhI8XVbpqCW0uKDGf9gSPDvpWN6vrm-6YKrZA8FQaZ_KO5bN06joAlOWKRGwYtOwxWt0C4A"/>
</div>
<div class="relative z-20 p-6 -mt-12">
<div class="bg-surface/95 backdrop-blur-md rounded-lg p-5 border border-outline-variant/10 shadow-sm">
<p class="font-label-caps text-label-caps text-secondary uppercase tracking-widest mb-2">Live Music Event</p>
<h2 class="font-headline-md text-headline-md text-primary mb-1">The Midnight Sessions</h2>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Thu, Oct 24 • 9:00 PM</p>
<div class="flex items-start gap-4 p-4 bg-surface-container-low rounded-lg">
<span class="material-symbols-outlined text-outline mt-1" data-icon="event_seat">event_seat</span>
<div>
<p class="font-body-lg text-body-lg text-on-surface">VIP Booth 4</p>
<p class="font-body-md text-body-md text-on-surface-variant">Main Floor, Stage Right</p>
</div>
</div>
</div>
</div>
</section>
<!-- Payment Breakdown -->
<section class="mb-stack-lg">
<h3 class="font-headline-md text-headline-md mb-6">Order Summary</h3>
<div class="space-y-4 font-body-md text-body-md">
<div class="flex justify-between items-center text-on-surface">
<span>VIP Booth 4</span>
<span>$150.00</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span>Service Fee</span>
<span>$12.50</span>
</div>
<div class="flex justify-between items-center text-on-surface-variant">
<span>Tax</span>
<span>$14.22</span>
</div>
<hr class="border-t border-outline-variant/20 my-4"/>
<div class="flex justify-between items-center font-headline-md text-headline-md text-primary pt-2">
<span>Total</span>
<span>$176.72</span>
</div>
</div>
</section>
<!-- Payment Methods -->
<section class="mb-stack-lg flex-1">
<h3 class="font-headline-md text-headline-md mb-6">Payment Method</h3>
<div class="space-y-3">
<!-- Aura Wallet Option -->
<label class="flex items-center p-4 border border-outline-variant/30 rounded-lg bg-surface-container-low cursor-pointer hover:bg-surface-container transition-colors">
<input checked="" class="form-radio text-primary focus:ring-primary h-5 w-5 border-outline-variant" name="payment" type="radio" value="wallet"/>
<div class="ml-4 flex-1 flex justify-between items-center">
<span class="font-body-lg text-body-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-secondary" data-icon="account_balance_wallet">account_balance_wallet</span>
                            Aura Wallet
                        </span>
<span class="font-body-md text-body-md text-on-surface-variant">Bal: $450.00</span>
</div>
</label>
<!-- Apple Pay Option -->
<label class="flex items-center p-4 border border-outline-variant/30 rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio text-primary focus:ring-primary h-5 w-5 border-outline-variant" name="payment" type="radio" value="apple"/>
<div class="ml-4 flex-1">
<span class="font-body-lg text-body-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface" data-icon="phone_iphone">phone_iphone</span>
                            Apple Pay
                        </span>
</div>
</label>
<!-- Credit Card Option -->
<label class="flex items-center p-4 border border-outline-variant/30 rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors">
<input class="form-radio text-primary focus:ring-primary h-5 w-5 border-outline-variant" name="payment" type="radio" value="card"/>
<div class="ml-4 flex-1">
<span class="font-body-lg text-body-lg text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-on-surface" data-icon="credit_card">credit_card</span>
                            Credit Card ending in 4242
                        </span>
</div>
</label>
<button class="w-full py-4 mt-2 font-button text-button text-secondary flex items-center justify-center gap-2 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="add">add</span>
                    Add new payment method
                </button>
</div>
</section>
</main>
<!-- Persistent Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-background/90 backdrop-blur-xl border-t border-outline-variant/10 px-margin-mobile py-4 pb-safe z-40">
<div class="flex items-center justify-between mb-4">
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase">Total Due</p>
<p class="font-headline-md text-headline-md text-primary">$176.72</p>
</div>
<button class="bg-primary text-on-primary font-button text-button py-4 px-10 rounded-lg hover:bg-primary-container transition-colors active:scale-95 flex items-center gap-2 shadow-sm">
                Confirm &amp; Pay
                <span class="material-symbols-outlined text-on-primary" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<p class="text-center font-label-caps text-label-caps text-outline text-[10px]">By confirming, you agree to our Terms of Service</p>
</div>
