<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .glass-panel { background: rgba(251, 249, 244, 0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .aura-card { transition: all 0.3s ease; border: 1px solid rgba(207, 196, 189, 0.3); }
        .aura-card:hover { transform: translateY(-4px); border-color: rgba(207, 196, 189, 0.8); }
        .aura-card.selected { border-color: theme('colors.primary'); background-color: theme('colors.surface-container-high'); }

<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- TopNavBar component logic suppressed: Linear/Transactional Onboarding Intent -->
<main class="flex-grow flex items-stretch">
<!-- Left Content Area -->
<div class="w-full lg:w-1/2 flex flex-col justify-center px-margin-mobile lg:px-margin-desktop py-stack-lg relative z-10">
<div class="max-w-md mx-auto w-full space-y-stack-md">
<header class="space-y-4">
<div class="flex items-center space-x-2 text-primary font-label-caps text-label-caps uppercase tracking-widest">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">tune</span>
<span>Aura Setup</span>
</div>
<h1 class="font-display-md text-display-md text-primary tracking-tight">Define your atmosphere.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                        Select the sonic signatures that resonate with your space. This will curate the initial lounge experience.
                    </p>
</header>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
<!-- Atmosphere Options -->
<button class="aura-card text-left p-6 rounded-lg bg-surface flex flex-col gap-4 group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors text-3xl" style="font-variation-settings: 'FILL' 0;">nightlife</span>
<div>
<h3 class="font-button text-button text-primary mb-1">Late Night Jazz</h3>
<p class="font-body-md text-sm text-on-surface-variant">Smoky, syncopated, and intimate.</p>
</div>
</button>
<button class="aura-card text-left p-6 rounded-lg bg-surface flex flex-col gap-4 group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors text-3xl" style="font-variation-settings: 'FILL' 0;">air</span>
<div>
<h3 class="font-button text-button text-primary mb-1">Atmospheric Ambient</h3>
<p class="font-body-md text-sm text-on-surface-variant">Ethereal textures and calm focus.</p>
</div>
</button>
<button class="aura-card text-left p-6 rounded-lg bg-surface flex flex-col gap-4 group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors text-3xl" style="font-variation-settings: 'FILL' 0;">album</span>
<div>
<h3 class="font-button text-button text-primary mb-1">Neo-Soul</h3>
<p class="font-body-md text-sm text-on-surface-variant">Warm grooves and modern rhythms.</p>
</div>
</button>
<button class="aura-card text-left p-6 rounded-lg bg-surface flex flex-col gap-4 group" onclick="this.classList.toggle('selected')">
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors text-3xl" style="font-variation-settings: 'FILL' 0;">piano</span>
<div>
<h3 class="font-button text-button text-primary mb-1">Classical Minimalism</h3>
<p class="font-body-md text-sm text-on-surface-variant">Structured, elegant, and timeless.</p>
</div>
</button>
</div>
<div class="pt-8 flex items-center justify-between border-t border-outline-variant/10">
<span class="font-label-caps text-label-caps text-on-surface-variant">Step 1 of 3</span>
<button class="bg-primary text-on-primary font-button text-button px-8 py-4 rounded hover:bg-primary-container transition-colors duration-300">
                        Complete Your Profile
                    </button>
</div>
</div>
</div>

<div class="absolute inset-0 bg-cover bg-center" data-alt="A serene, minimalist modern interior lounge space. Soft, high-key natural lighting illuminates a comfortable dark leather accent chair next to a simple wooden side table holding a ceramic vase with delicate branches. The aesthetic is luxurious, calm, and uncluttered, adhering strictly to a premium, neutral color palette with deep charcoal accents." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAzqr6FDgSgnsiau3AsuscGUmcfPkfZyM7roq9txh8yhL1r5avmSI9mMMuC9d66O5Jz9L8c4AZlJgC7H5D-gx8JIoMjfzFT43xsh-cU-RPCDfO3VE9FZPyplxSQBwcfmewFhOSTHeia6DxssXnyQ-PnVh1z0YFrJpNmiAwQ9wu1rutANax5Yd1SIAFuM9jP56FGR1u1wGKJcTeH08PJHJvik_SJAMl9B1VLQLYg64sSE44qGPBQaBighQ')"></div>

</div>
