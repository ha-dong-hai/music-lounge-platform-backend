        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col md:hidden antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md">
<div class="flex items-center justify-between px-margin-mobile h-16">
<button class="text-primary hover:opacity-70 transition-opacity scale-95 active:transition-transform">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-display-md text-headline-md text-primary tracking-tighter">AuraLounge</h1>
<button class="text-primary hover:opacity-70 transition-opacity scale-95 active:transition-transform">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 pt-[80px] pb-[100px] px-margin-mobile flex flex-col gap-stack-md overflow-y-auto">
<section class="flex flex-col gap-unit">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Lounge Discovery</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Curated atmospheres for the discerning listener.</p>
</section>
<!-- Gallery Grid -->
<div class="flex flex-col gap-stack-sm">
<!-- Card 1 -->
<article class="relative w-full aspect-[4/5] rounded-xl overflow-hidden group">
<div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida/AP1WRLsXnP_mKVgM0SowIcx9Nj3cSrBfd2MO1LT9A2FPt1cnW_qLXgBBevWvhDCqHYlFKLEsRSly60wt8e-5GU175IMJQxZ-oz8AQ5WTORzqhEIW88Fgdb9V8S2RceOezpWYeNWRt6OQbFfakv1neXohissiuBwUUklAumAUMctAIuBA1A_g0CPUdcBr175HhW74wb1zd85coT6iqIoQwrycxyzaTRITdWeVOvISrFYoN7cjwOjW59_30qPXNzg');"></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
<div class="absolute top-4 left-4">
<span class="inline-flex items-center px-3 py-1 bg-surface-bright/90 backdrop-blur-sm rounded text-primary font-label-caps text-label-caps">Intimate</span>
</div>
<div class="absolute bottom-0 left-0 w-full p-4 flex flex-col gap-unit">
<h3 class="font-headline-md text-headline-md text-surface-bright">The Blue Note Room</h3>
<p class="font-body-md text-body-md text-surface-variant/80 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span> New York City
                    </p>
<button class="mt-2 w-full bg-primary text-on-primary font-button text-button py-3 rounded-lg border border-primary/20 hover:bg-primary-container transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">360</span> Explore 360 View
                    </button>
</div>
</article>
<!-- Card 2 -->
<article class="relative w-full aspect-[4/5] rounded-xl overflow-hidden group mt-4">
<img class="absolute inset-0 w-full h-full object-cover" data-alt="A meticulously designed, minimalist japanese tea house interior acting as a calm listening lounge. Natural warm wood tones, shoji screens letting in soft diffused sunlight, low-profile elegant furniture. A vintage high-end turntable setup rests quietly in the corner. The aesthetic is extremely high-end, serene, and grounded, evoking a sense of quiet luxury." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBXvHZFJHAWZhHM8lsiFR0pJgPqPBy2tSyvh3Zl57UMyvqLFbJ05TZ3yFtwgcr3NlvPE5_RZenxyDBeDzlIkgQTImOwG7ITABkf1vmRkQwgPvkOEB7DuK4JIKppWko-HebRkn-bLlmcEL0ZOcJk4bkCQfOMj8SZsHKfg7R6w2VriWU7p0Ya__FRor58P5YVDO1O96p_CC5yQUeniSVzy4JX6ImNPYoh5vIHRpEFxfxvDhfdFNFvbFN0dA"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
<div class="absolute top-4 left-4">
<span class="inline-flex items-center px-3 py-1 bg-surface-bright/90 backdrop-blur-sm rounded text-primary font-label-caps text-label-caps">Architectural</span>
</div>
<div class="absolute bottom-0 left-0 w-full p-4 flex flex-col gap-unit">
<h3 class="font-headline-md text-headline-md text-surface-bright">Kyoto Kissa</h3>
<p class="font-body-md text-body-md text-surface-variant/80 flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]">location_on</span> Tokyo
                    </p>
<button class="mt-2 w-full bg-surface-bright text-primary font-button text-button py-3 rounded-lg border border-outline-variant hover:bg-surface-container transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">360</span> Explore 360 View
                    </button>
</div>
</article>

<span class="font-label-caps text-label-caps mt-1">Discovery</span>
</button>

<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors tap-highlight-transparent active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps mt-1">Profile</span>
