<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.aura-chip');
            
            chips.forEach(chip => {
                chip.addEventListener('click', () => {
                    const isSelected = chip.classList.contains('bg-primary');
                    
                    if (isSelected) {
                        // Revert to inactive state
                        chip.classList.remove('bg-primary', 'text-on-primary', 'border-primary');
                        chip.classList.add('border-outline-variant', 'text-on-surface-variant', 'hover:bg-surface-container-high');
                    } else {
                        // Apply active state
                        chip.classList.remove('border-outline-variant', 'text-on-surface-variant', 'hover:bg-surface-container-high');
                        chip.classList.add('bg-primary', 'text-on-primary', 'border-primary');
                    }
                });
            });
        });
    </script>
