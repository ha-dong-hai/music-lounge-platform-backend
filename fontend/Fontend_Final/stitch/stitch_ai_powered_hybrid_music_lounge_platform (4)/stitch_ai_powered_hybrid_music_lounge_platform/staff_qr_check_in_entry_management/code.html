<style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-primary text-on-primary min-h-screen relative font-body-lg">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-primary/90 backdrop-blur-md flex justify-between items-center px-margin-mobile h-20 shadow-[0_4px_40px_rgba(0,0,0,0.2)]">
<button class="text-on-primary hover:opacity-70 transition-opacity scale-95 duration-300">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-display-md text-display-md tracking-widest text-surface-bright">AURA</div>
<button class="text-on-primary hover:opacity-70 transition-opacity scale-95 duration-300">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-margin-mobile flex flex-col items-center justify-center min-h-screen">
<div class="w-full max-w-md flex flex-col gap-stack-md">
<!-- Scan Header -->
<div class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-unit text-surface-bright">Scan Ticket</h1>
<p class="font-body-md text-body-md text-on-primary-container">Align QR code within the frame.</p>
</div>
<!-- Scanner Viewfinder -->
<div class="relative w-full aspect-square rounded-xl overflow-hidden border border-outline/20 bg-primary-container shadow-[0_8px_32px_rgba(0,0,0,0.4)] flex items-center justify-center group">
<!-- Simulated Camera Feed -->
<div class="absolute inset-0 bg-noise opacity-50 z-0 mix-blend-overlay"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary/80 to-transparent z-10"></div>
<!-- Viewfinder Guides -->
<div class="absolute w-3/4 h-3/4 border-2 border-surface-bright/30 rounded-lg z-20 flex flex-col justify-between">
<div class="flex justify-between w-full">
<div class="w-8 h-8 border-t-4 border-l-4 border-surface-bright rounded-tl-lg"></div>
<div class="w-8 h-8 border-t-4 border-r-4 border-surface-bright rounded-tr-lg"></div>
</div>
<!-- Scanning Line Animation -->
<div class="w-full h-0.5 bg-secondary-fixed shadow-[0_0_15px_#ffdea5] absolute top-1/2 left-0 -translate-y-1/2 animate-[scan_2s_ease-in-out_infinite]"></div>
<div class="flex justify-between w-full">
<div class="w-8 h-8 border-b-4 border-l-4 border-surface-bright rounded-bl-lg"></div>
<div class="w-8 h-8 border-b-4 border-r-4 border-surface-bright rounded-br-lg"></div>
</div>
</div>
<!-- Status Overlay (Success/Pending) -->
<div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-30 bg-primary-fixed text-primary px-4 py-2 rounded-full font-button text-button flex items-center gap-2 shadow-lg backdrop-blur-sm opacity-0 transition-opacity duration-300 group-hover:opacity-100">
<span class="material-symbols-outlined text-green-600" data-icon="check_circle">check_circle</span>
                    Ready to Scan
                </div>
</div>
<style>
                @keyframes scan {
                    0% { top: 10%; opacity: 0; }
                    10% { opacity: 1; }
                    90% { opacity: 1; }
                    100% { top: 90%; opacity: 0; }
                }
            </style>
<!-- Manual Entry OR Divider -->
<div class="flex items-center gap-4 w-full">
<div class="h-px bg-outline/20 flex-1"></div>
<span class="font-label-caps text-label-caps text-on-primary-container">OR MANUAL ENTRY</span>
<div class="h-px bg-outline/20 flex-1"></div>
</div>
<!-- Manual Entry Field -->
<div class="w-full relative">
<input class="w-full bg-primary-container border border-outline/30 rounded-lg px-4 py-3 font-body-md text-body-md text-surface-bright placeholder-on-primary-container focus:outline-none focus:border-surface-bright transition-colors" placeholder="Enter Reference ID" type="text"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 bg-surface-bright text-primary px-4 py-1.5 rounded font-button text-button hover:bg-surface transition-colors">Verify</button>
</div>
<!-- Recent Scan Card (Mock Success Data) -->
<div class="w-full mt-stack-sm bg-primary-container border border-outline/20 rounded-xl p-6 shadow-lg">
<div class="flex justify-between items-start mb-4">
<div>
<span class="font-label-caps text-label-caps text-secondary-fixed mb-1 block">LAST SCAN</span>
<h3 class="font-headline-md text-headline-md text-surface-bright">Elias Vance</h3>
</div>
<div class="bg-green-500/10 text-green-400 px-3 py-1 rounded-full border border-green-500/20 font-label-caps text-label-caps flex items-center gap-1">
<span class="material-symbols-outlined text-[16px]" data-icon="verified">verified</span> Valid
                    </div>
</div>
<div class="flex flex-col gap-2 font-body-md text-body-md text-on-primary-container">
<div class="flex justify-between">
<span>Tier</span>
<span class="text-surface-bright font-medium">VIP Balcony</span>
</div>
<div class="flex justify-between">
<span>Seat</span>
<span class="text-surface-bright font-medium">B-12, Row 4</span>
</div>
<div class="flex justify-between">
<span>Ref ID</span>
<span class="text-surface-bright font-medium">#AX-992B</span>
</div>
</div>
</div>
</div>
</main>
