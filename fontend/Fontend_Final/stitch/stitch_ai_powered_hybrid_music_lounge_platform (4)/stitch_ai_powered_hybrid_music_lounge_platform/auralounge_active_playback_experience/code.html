<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<style>
        .glass-panel {
            background: rgba(251, 249, 244, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(126, 117, 111, 0.15);
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .animate-shimmer {
            animation: shimmer 2s infinite linear;
        }
        @keyframes eq {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col relative overflow-hidden font-body-md">
<!-- Top Navigation (Shared Component) -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim flat no shadows flex justify-between items-center px-margin-mobile py-4 z-40">
<button class="text-primary dark:text-primary-fixed hover:opacity-80 transition-opacity cursor-pointer transition-transform duration-200 active:scale-95 flex items-center justify-center p-2 rounded-full focus:outline-none focus:ring-2 focus:ring-outline-variant">
<span class="material-symbols-outlined text-2xl" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-display-md text-display-md text-primary dark:text-primary-fixed">AuraLounge</h1>
<button class="font-button text-button px-6 py-2 bg-primary text-on-primary rounded hover:opacity-90 transition-opacity cursor-pointer transition-transform duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary-container">
            Join
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col relative h-[calc(100vh-80px)]">
<!-- Background Texture Overlay (Subtle Depth) -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] z-0" style="background-image: url('data:image/svg+xml,%3Csvg width=\'100\' height=\'100\' viewBox=\'0 0 100 100\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noise\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'4\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100\' height=\'100\' filter=\'url(%23noise)\'/%3E%3C/svg%3E');"></div>
<!-- 3D Scene Area (Top 60%) -->
<section class="relative w-full h-[60%] flex flex-col items-center justify-center z-10 p-margin-mobile">
<div class="absolute top-margin-mobile text-center z-20 w-full px-margin-mobile">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">The Resonance of Vinyl</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">Experience analog warmth in a digital space.</p>
</div>
<!-- 3D Animation Placeholder -->
<div class="w-full h-full max-w-md mx-auto relative mt-12 flex items-center justify-center">
<!-- Glow pulse -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none -z-10 mt-12">
<div class="w-64 h-64 bg-secondary/15 rounded-full blur-3xl animate-[pulse_3s_ease-in-out_infinite]"></div>
</div>

<!-- Static Fallback Image / Reference -->
<div class="absolute opacity-20 pointer-events-none transform scale-90 -z-10 mix-blend-multiply">
<img alt="Victrola record player reference" class="object-contain w-full h-full max-h-[300px]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCk_OtnePhRlPR6A4nDQa65kso-l6HNSzJSzv6AnGsVu5uHquNRrWP8Ml9mDww8JTxnlzK_Jy-Ov9Zr4h0NyV4t2rzmElevkQ7D8khpwm2EqZyAX00JLW5r6ySgdMwLx1cqHYIaohdEwCXCZcRN40rhxgnuvd0ZBprmjmQlpCFPymT0u-MVl8mtgd0t9gH7t9zGeJvmCdhLtOy8Ox5El6HYolWXxsZsc7r70OlCyJACHMja9MGbCpievPeveU1qvpT_44Q"/>
</div>
</div>
</section>
<!-- Glassmorphic Playback Control Panel (Bottom 40%) -->
<section class="absolute bottom-0 w-full glass-panel z-30 pt-8 pb-32 px-margin-mobile flex flex-col items-center rounded-t-[32px] shadow-[0_-8px_40px_rgba(24,21,18,0.03)]">
<!-- Track Info -->
<div class="w-full max-w-md flex flex-col items-center mb-8 text-center">
<div class="flex items-center gap-3 mb-2 justify-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Now Playing</span>
<div class="flex items-end gap-1 h-4 pb-[2px]">
<div class="w-[3px] bg-primary dark:bg-primary-fixed rounded-full" style="animation: eq 0.8s ease-in-out infinite 0s;"></div>
<div class="w-[3px] bg-primary dark:bg-primary-fixed rounded-full" style="animation: eq 1.2s ease-in-out infinite 0.2s;"></div>
<div class="w-[3px] bg-primary dark:bg-primary-fixed rounded-full" style="animation: eq 0.9s ease-in-out infinite 0.4s;"></div>
<div class="w-[3px] bg-primary dark:bg-primary-fixed rounded-full" style="animation: eq 1.1s ease-in-out infinite 0.1s;"></div>
<div class="w-[3px] bg-primary dark:bg-primary-fixed rounded-full" style="animation: eq 1.0s ease-in-out infinite 0.5s;"></div>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-primary mb-1">Nocturne in E-Flat Major</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Frédéric Chopin • Vinyl Remaster</p>
</div>
<!-- Progress Bar -->
<div class="w-full max-w-md mb-8 flex items-center gap-4">
<span class="font-label-caps text-label-caps text-outline-variant w-10 text-right">0:42</span>
<div class="flex-grow h-1 bg-surface-variant rounded-full relative cursor-pointer overflow-hidden">
<div class="absolute top-0 left-0 h-full bg-primary rounded-full overflow-hidden" style="width: 35%;">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/40 to-transparent w-full animate-shimmer"></div>
</div>
</div>
<span class="font-label-caps text-label-caps text-outline-variant w-10 text-left">4:28</span>
</div>
<!-- Controls -->
<div class="w-full max-w-xs flex justify-between items-center px-4">
<button aria-label="Shuffle" class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none rounded-full p-2">
<span class="material-symbols-outlined text-2xl" data-icon="shuffle">shuffle</span>
</button>
<button aria-label="Previous Track" class="text-primary hover:opacity-80 transition-opacity focus:outline-none rounded-full p-2">
<span class="material-symbols-outlined text-4xl" data-icon="skip_previous" data-weight="fill" style="font-variation-settings: 'FILL' 1;">skip_previous</span>
</button>
<button aria-label="Pause" class="bg-primary text-on-primary w-20 h-20 rounded-full flex items-center justify-center hover:scale-105 transition-transform shadow-[0_4px_20px_rgba(24,21,18,0.15)] focus:outline-none">
<span class="material-symbols-outlined text-4xl" data-icon="pause" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button aria-label="Next Track" class="text-primary hover:opacity-80 transition-opacity focus:outline-none rounded-full p-2">
<span class="material-symbols-outlined text-4xl" data-icon="skip_next" data-weight="fill" style="font-variation-settings: 'FILL' 1;">skip_next</span>
</button>
<button aria-label="Repeat" class="text-on-surface-variant hover:text-primary transition-colors focus:outline-none rounded-full p-2">
<span class="material-symbols-outlined text-2xl" data-icon="repeat">repeat</span>
</button>
</div>
</section>
</main>
<!-- Bottom Navigation (Shared Component - Discovery Active) -->
<!-- Suppressed active state logic dictates we highlight Discovery as it's an exploration page -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center pt-3 pb-6 px-margin-mobile border-t border-outline/10 bg-surface/80 backdrop-blur-xl shadow-[0_-4px_40px_rgba(24,21,18,0.05)] transition-all duration-300 ease-in-out">
<!-- Active: Discovery -->
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed font-semibold hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">
<div class="px-4 py-1 rounded-full bg-surface-variant/50 mb-1">
<span class="material-symbols-outlined text-2xl" data-icon="explore" data-weight="fill" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<span class="font-label-caps text-label-caps">Discovery</span>
</a>
<!-- Inactive: Tickets -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">
<div class="px-4 py-1 rounded-full mb-1">
<span class="material-symbols-outlined text-2xl" data-icon="confirmation_number">confirmation_number</span>
</div>
<span class="font-label-caps text-label-caps">Tickets</span>
</a>
<!-- Inactive: Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:text-primary dark:hover:text-primary-fixed transition-colors" href="#">
<div class="px-4 py-1 rounded-full mb-1">
<span class="material-symbols-outlined text-2xl" data-icon="account_circle">account_circle</span>
</div>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
</body></html>
