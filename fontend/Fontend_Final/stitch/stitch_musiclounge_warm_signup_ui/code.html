<script>
        // Parallax Effect for Polaroids
        const container = document.getElementById('parallax-container');
        const polaroids = container.querySelectorAll('[data-parallax-factor]');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Normalize coordinates from -1 to 1 based on center
            const normX = (x / rect.width) * 2 - 1;
            const normY = (y / rect.height) * 2 - 1;

            polaroids.forEach(el => {
                const factor = parseFloat(el.getAttribute('data-parallax-factor'));
                // Inverse movement for softer effect
                const moveX = normX * -20 * factor;
                const moveY = normY * -20 * factor;
                
                // Get original rotation from inline style or compute it (simplified for demo)
                const baseTransform = el.firstElementChild.style.transform || '';
                
                // We apply transform to the wrapper to keep the CSS hover rotation on the child intact
                el.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });

        // Role Toggle Logic
        function setRole(role) {
            const slider = document.getElementById('role-slider');
            const buttons = slider.parentElement.querySelectorAll('button');
            
            if (role === 'listener') {
                slider.style.transform = 'translateX(0)';
                buttons[0].classList.add('text-primary');
                buttons[0].classList.remove('text-on-surface-variant', 'hover:text-on-surface');
                buttons[1].classList.remove('text-primary');
                buttons[1].classList.add('text-on-surface-variant', 'hover:text-on-surface');
            } else {
                slider.style.transform = 'translateX(100%)';
                buttons[1].classList.add('text-primary');
                buttons[1].classList.remove('text-on-surface-variant', 'hover:text-on-surface');
                buttons[0].classList.remove('text-primary');
                buttons[0].classList.add('text-on-surface-variant', 'hover:text-on-surface');
            }
        }

        // Password Toggle
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple Password Strength Meter
        function checkStrength() {
            const val = document.getElementById('password').value;
            const s1 = document.getElementById('str-1');
            const s2 = document.getElementById('str-2');
            const s3 = document.getElementById('str-3');
            
            // Reset
            [s1, s2, s3].forEach(el => el.className = 'h-1 flex-1 rounded-full bg-surface-variant transition-colors duration-300');

            if (val.length > 0) {
                s1.classList.remove('bg-surface-variant');
                s1.classList.add('bg-error'); // Weak
            }
            if (val.length > 5 && /[A-Z]/.test(val) && /[0-9]/.test(val)) {
                s1.classList.replace('bg-error', 'bg-primary-container');
                s2.classList.remove('bg-surface-variant');
                s2.classList.add('bg-primary-container'); // Medium
            }
            if (val.length > 8 && /[!@#$%^&*]/.test(val)) {
                s1.classList.replace('bg-primary-container', 'bg-tertiary');
                s2.classList.replace('bg-primary-container', 'bg-tertiary');
                s3.classList.remove('bg-surface-variant');
                s3.classList.add('bg-tertiary'); // Strong
            }
        }
    </script>
