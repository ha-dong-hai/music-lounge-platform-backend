<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Trigger entry animations
            setTimeout(() => {
                document.querySelectorAll('.fade-in-item').forEach(el => {
                    el.classList.remove('translate-y-8', 'opacity-0');
                });
            }, 100);

            // Simple Parallax Effect
            const parallaxContainer = document.getElementById('parallax-container');
            const layers = document.querySelectorAll('.parallax-layer');

            if(parallaxContainer && layers.length > 0) {
                parallaxContainer.addEventListener('mousemove', (e) => {
                    const rect = parallaxContainer.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    layers.forEach(layer => {
                        const speed = layer.getAttribute('data-speed');
                        const xOffset = (centerX - x) * speed;
                        const yOffset = (centerY - y) * speed;
                        
                        // We need to preserve the rotation from the CSS variable
                        layer.style.transform = `translate(${xOffset}px, ${yOffset}px) rotate(var(--rotation))`;
                    });
                });
                
                parallaxContainer.addEventListener('mouseleave', () => {
                     layers.forEach(layer => {
                        layer.style.transform = `translate(0px, 0px) rotate(var(--rotation))`;
                    });
                });
            }

            // OTP Input Logic
            const inputs = document.querySelectorAll('.otp-input');
            const submitBtn = document.getElementById('submit-btn');
            const form = document.getElementById('otp-form');
            const errorMsg = document.getElementById('error-message');

            const checkInputs = () => {
                let allFilled = true;
                let val = '';
                inputs.forEach(input => {
                    if (!input.value) allFilled = false;
                    val += input.value;
                });
                submitBtn.disabled = !allFilled;
                return val;
            };

            inputs.forEach((input, index) => {
                // Focus styling helper
                input.addEventListener('focus', () => {
                    input.select();
                });

                input.addEventListener('input', (e) => {
                    // Only allow numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    
                    // Clear error state on typing
                    inputs.forEach(inp => inp.classList.remove('shake-error'));
                    errorMsg.classList.remove('opacity-100');
                    errorMsg.classList.add('opacity-0');

                    checkInputs();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });

                // Paste support
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text/plain').slice(0, inputs.length).replace(/[^0-9]/g, '');
                    
                    if(pastedData) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (inputs[i]) {
                                inputs[i].value = pastedData[i];
                            }
                        }
                        const focusIndex = Math.min(pastedData.length, inputs.length - 1);
                        inputs[focusIndex].focus();
                        checkInputs();
                    }
                });
            });

            // Form Submit Simulation
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const code = checkInputs();
                
                if(code.length === 6) {
                    // Simulate Loading
                    const btnText = document.getElementById('btn-text');
                    const btnLoader = document.getElementById('btn-loader');
                    
                    btnText.classList.add('invisible');
                    btnLoader.classList.remove('hidden');
                    inputs.forEach(inp => inp.disabled = true);
                    submitBtn.disabled = true;

                    // Simulate API Call
                    setTimeout(() => {
                        if(code === '000000') {
                            // Simulate Error
                            btnText.classList.remove('invisible');
                            btnLoader.classList.add('hidden');
                            inputs.forEach(inp => {
                                inp.disabled = false;
                                inp.classList.add('shake-error');
                            });
                            errorMsg.classList.remove('opacity-0');
                            errorMsg.classList.add('opacity-100');
                            submitBtn.disabled = false;
                            inputs[5].focus();
                        } else {
                            // Simulate Success (just reset for demo)
                            btnText.classList.remove('invisible');
                            btnText.innerText = 'Thành công!';
                            btnLoader.classList.add('hidden');
                            submitBtn.classList.replace('bg-primary', 'bg-tertiary');
                        }
                    }, 1500);
                }
            });
        });
    </script>
