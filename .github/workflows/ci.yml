# Added 2026-08-09 in response to a production-hardening audit finding: this repo had NO automated
# build/test gate of any kind — not even the SQLite-backed suite was guaranteed to run before a
# merge, so even that limited safety net could silently stop firing without anyone noticing.
#
# Known limitation, on purpose rather than by oversight: this only runs the suite against the
# SQLite-backed WebApplicationFactory harness (tests/MusicLounge.Tests.Integration), not against a
# real SQL Server instance. This project has already hit at least one real bug (a "multiple cascade
# paths" foreign-key error, SQL Server error 1785) that SQLite's EnsureCreatedAsync does not enforce
# and that this CI run therefore cannot catch — see role-db-integrity-review's SKILL.md and
# role-qa-test-design's SKILL.md for the full context. A SQL Server service container could close
# that gap but is a larger, separate addition (service container + real `dotnet ef database update`
# step) — deliberately not bundled into this first CI pass so the basic gate lands now rather than
# waiting on the larger piece. Running the suite against real SQL Server before any release that
# touches migrations, cascade behavior, or enum-string columns remains a manual step until that
# follow-up exists.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MusicLounge.sln

      - name: Build
        run: dotnet build MusicLounge.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test MusicLounge.sln --no-build --configuration Release --logger "console;verbosity=normal"

      - name: List outdated/vulnerable packages (non-blocking)
        # Informational only for now — see role-devops-release-readiness's finding on the absence of
        # any automated vulnerability-scanning process. A failing exit code here would block every PR
        # on a pre-existing advisory this team hasn't triaged yet; surface it in logs first.
        run: dotnet list MusicLounge.sln package --vulnerable --include-transitive || true
