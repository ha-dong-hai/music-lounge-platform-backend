# Auto-syncs the "backend-only" branch (a generated, whitelist-filtered mirror of master used for
# lean backend-only deploys/checkouts) on every push to master, via scripts/export-backend-only-branch.ps1.
#
# Added 2026-08-21 after that script had to be run by hand more than once and drifted out of sync
# with real merged work (backend-only was missing an entire merged feature until someone remembered
# to re-run it) — the whole point of the script existing is defeated if running it is a manual,
# easy-to-forget step. This closes that gap permanently: every push to master keeps backend-only
# current without anyone needing to remember to do anything.
name: Sync backend-only branch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure git identity for the export commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run export script
        shell: pwsh
        run: ./scripts/export-backend-only-branch.ps1 -SourceRef master -Push
